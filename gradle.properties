# Gradle / 构建
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:ReservedCodeCacheSize=256m -Xmx3g
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：官方样例开启；我们先开着，出问题再关（并在 PLAN §3.3 记录）
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -Xmx2g

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

name: CI

# 门禁 G0–G3 的机器化版本（PROCESS.md §6 / PLAN.md §3.3 第 9 步）。
#
# ⚠️ 状态：**内容已在本地等价跑通**（`artifacts/tools/ci-local.ps1` 跑同样四步，
# 2026-10-10 从 clean 起全绿），但**还没在真实 GitHub 上跑过**——本工作区没有 git 远端，
# 建仓库与首次推送必须由人做（命令见 `RELEASE.md` §9）。首次真跑的结果请记进 PLAN.md §3.3。
#
# action 版本（2026-10-10 核对过「最新大版本」；写错版本号会让第一次跑直接红）：
#   actions/checkout            v6（原写 v7 —— 不存在）
#   actions/setup-java          v5（原写 v6 —— 不存在；v5.3.0 已发布）
#   gradle/actions/setup-gradle v4（保守取已存在的大版本；能核实到更高版本时再升）
#   actions/upload-artifact     v4

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 同一分支上后推的提交取消前一次还在跑的（省 runner 时间，也避免两个 run 抢同一份缓存）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：这个工作流只读代码、只上传产物
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 打印环境（第一次真跑时靠它定位问题）
        run: |
          java -version
          ./gradlew --version --console=plain

      # 临时诊断：runner 到底能不能取到 KSP 的插件标记（排查「not found」是网络还是 Gradle 层面）
      - name: 诊断（临时）：取 KSP 插件标记
        run: |
          for u in \
            "https://repo.maven.apache.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" \
            "https://plugins.gradle.org/m2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" \
            "https://maven.aliyun.com/repository/gradle-plugin/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" \
            "https://maven.aliyun.com/repository/public/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.12/com.google.devtools.ksp.gradle.plugin-2.3.12.pom" ; do
            printf '%s → ' "$u"
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 25 "$u" || echo "curl 失败(退出码 $?)"
          done

      # 依赖源：仓库里配了阿里云镜像在前、google()/mavenCentral() 兜底（settings.gradle.kts），
      # 海外 runner 上镜像不通时会自动回落到官方源。
      - name: 静态检查（Spotless/ktlint）
        run: ./gradlew :app:spotlessCheck --console=plain

      - name: 单元测试（JVM + Robolectric）
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # 截图回归：基线在 app/src/test/screenshots/（随代码入库）。
      # 改了界面而没更新基线时这一步会红——那是要的，逼人看一眼视觉回归。
      # 更新基线：./gradlew :app:recordRoborazziDebug（本地跑，然后把 PNG 一起提交）
      - name: 截图回归
        run: ./gradlew :app:verifyRoborazziDebug --console=plain

      # R8 之后能不能跑：单元测试不跑 R8，所以至少要保证发布构建能产出来。
      # 真机冒烟（`--es dev backupcheck`）在装了 .r8smoke 变体的机器上人工跑，见 RELEASE.md §3。
      - name: 发布构建（R8 + 资源收缩）
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/src/test/screenshots/**
